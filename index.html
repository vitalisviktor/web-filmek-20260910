<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmek</title>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <table id="tablazat" class="table table-bordered table-hover">
        <thead>
            <td>Title</td>
            <td>Year</td>
            <td>Genre</td>
            <td>Rating</td>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
    <form action="" class="form-inline" id="formocska">
        <label for="Title">Title: </label>
        <input type="text" placeholder="Title" title="Title" class="form-control" required name="Title">
        <label for="Year">Year: </label>
        <input type="number" placeholder="Year" title="Year" class="form-control" required name="Year">
        <label for="Genre">Genre: </label>
        <input type="text" placeholder="Genre" title="Genre" class="form-control" required name="Genre">
        <label for="Rating">Rating: </label>
        <input type="number" placeholder="Rating" max="5" min="1" title="Rating" class="form-control" required name="Rating">
        <input type="submit" name="Submit" id="Submit" title="Submit" class="form-control" value="Add">
    </form>
</body>
<script src="script.js"></script>
</html>
